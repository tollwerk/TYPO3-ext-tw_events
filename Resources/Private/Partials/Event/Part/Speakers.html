<f:comment>
    Speakers of an event, with the details of the site settings "twEvents.speakers"
    @param Tollwerk\TwEvents\Domain\Model\Event event Event
</f:comment>
<f:if condition="{event.speakers}">
    <section class="Event__speakers" id="performers">
        <base:heading content="{f:translate(key: 'event.heading.speakers')}">
            <f:variable name="details" value="{events:details(of: 'speakers')}" />
            <f:render partial="Person/List" arguments="{people: event.speakers, details: details, class: 'p-performer', anchors: 1}" />
        </base:heading>
    </section>
</f:if>
