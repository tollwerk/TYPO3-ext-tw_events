<f:comment>
    Description of an event
    @param Tollwerk\TwEvents\Domain\Model\Event event Event
</f:comment>
<f:if condition="{event.description}">
    <section class="Event__description" id="description">
        <base:heading content="{f:translate(key: 'event.heading.description')}">
            <div class="e-content"><f:format.html>{event.description}</f:format.html></div>
        </base:heading>
    </section>
</f:if>
