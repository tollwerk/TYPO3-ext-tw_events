<f:comment>
    A session of an event, with the details of the speakers from the site settings "twEvents.speakers"
    @param Tollwerk\TwEvents\Domain\Model\Event event Event
    @param Tollwerk\TwEvents\Domain\Model\Session session Session
</f:comment>
<events:structuredData record="{session}" />
<twc:event.session event="{event}" session="{session}" details="{events:details(of: 'speakers')}" />
