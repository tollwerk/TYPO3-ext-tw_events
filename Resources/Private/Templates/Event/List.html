<f:comment>
    List of events
    @param iterable events Events
    @param string scope "upcoming", "cancelled", "past" or "all"
</f:comment>
<f:if condition="{events}">
    <f:then>
        <ol class="EventList">
            <f:for each="{events}" as="event">
                <li class="EventList__item"><f:render partial="Event/Teaser" arguments="{event: event}" /></li>
            </f:for>
        </ol>
    </f:then>
    <f:else>
        <p class="EventList__empty"><f:switch expression="{scope}"><f:case value="upcoming"><f:translate key="events.none.upcoming" /></f:case><f:case value="cancelled"><f:translate key="events.none.cancelled" /></f:case><f:case value="past"><f:translate key="events.none.past" /></f:case><f:defaultCase><f:translate key="events.none.all" /></f:defaultCase></f:switch></p>
    </f:else>
</f:if>
