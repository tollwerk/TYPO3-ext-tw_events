<f:comment>
    All organisations
    @param iterable organizations Organisations
</f:comment>
<ul class="OrganizationList">
    <f:for each="{organizations}" as="organization">
        <li class="OrganizationList__item"><f:render partial="Organization/Card" arguments="{organization: organization, details: {logo: 1}}" /></li>
    </f:for>
</ul>
