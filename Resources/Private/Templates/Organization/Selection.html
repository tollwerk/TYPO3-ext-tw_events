<f:comment>
    Organisations chosen in the plugin, as cards with the details chosen in it or as venues
    @param array organizations Organisations
    @param bool venues Whether to show them as venues with their address
    @param array details Details of the cards
</f:comment>
<f:if condition="{organizations}">
    <twc:event.organization.list organizations="{organizations}" venues="{venues}" details="{details}" />
</f:if>
