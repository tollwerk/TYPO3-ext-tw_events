<f:argument name="event" type="Tollwerk\TwEvents\Domain\Model\Event" description="Event" />
<f:comment>An event in a list</f:comment>
<article class="EventTeaser h-event">
    <f:variable name="uri" value="{events:uri.event(event: event)}" />
    <f:variable name="title"><f:if condition="{uri}"><f:then><a class="p-name u-url" href="{uri}">{event.title}</a></f:then><f:else><span class="p-name">{event.title}</span></f:else></f:if></f:variable>
    <base:heading content="{title}" class="EventTeaser__title">
        <p class="EventTeaser__when"><twc:event.dateRange start="{event.startDate}" end="{event.endDate}" /></p>
        <f:if condition="{event.location}">
            <p class="EventTeaser__where p-location">{event.location.name}<f:if condition="{event.location.locality}">, {event.location.locality}</f:if></p>
        </f:if>
        <f:if condition="{event.isCancelled}">
            <p class="EventTeaser__status"><f:translate domain="tw_events.messages" key="event.cancelled" /></p>
        </f:if>
        <f:if condition="{event.summary}">
            <p class="EventTeaser__summary p-summary">{event.summary}</p>
        </f:if>
    </base:heading>
</article>
