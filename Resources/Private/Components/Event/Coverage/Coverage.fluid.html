<f:argument name="coverage" type="Tollwerk\TwEvents\Domain\Model\Coverage[]" description="Coverage" />
<f:comment>Coverage of an event or a session, with links to addresses or files</f:comment>
<ul class="CoverageList">
    <f:for each="{coverage}" as="item">
        <f:comment>A link that TYPO3 cannot resolve, such as to a deleted file, leaves its item out, as in the structured data</f:comment>
        <f:variable name="url" value="{f:uri.typolink(parameter: item.url, absolute: 1)}" />
        <f:if condition="{url}">
            <li class="CoverageList__item CoverageList__item--{item.type}">
                <a href="{url}">{f:if(condition: item.title, then: item.title, else: url)}</a>
                <span class="CoverageList__meta">(<f:translate domain="tw_events.messages" key="coverage.type.{item.type}" /><f:if condition="{item.authorDisplayName}">, <f:translate domain="tw_events.messages" key="coverage.by" arguments="{0: item.authorDisplayName}" /></f:if>)</span>
            </li>
        </f:if>
    </f:for>
</ul>
