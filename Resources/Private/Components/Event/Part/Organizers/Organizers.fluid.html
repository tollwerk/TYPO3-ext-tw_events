<f:argument name="event" type="Tollwerk\TwEvents\Domain\Model\Event" description="Event" />
<f:argument name="details" type="array" optional="1" default="{}" description="Details of the people, as for a card" />
<f:comment>People who organise an event</f:comment>
<f:if condition="{event.organizers}">
    <section class="Event__organizers" id="hosts">
        <base:heading content="{f:translate(domain: 'tw_events.messages', key: 'event.heading.organizers')}">
            <twc:event.person.list people="{event.organizers}" details="{details}" class="p-organizer" />
        </base:heading>
    </section>
</f:if>
