<f:argument name="event" type="Tollwerk\TwEvents\Domain\Model\Event" description="Event" />
<f:comment>Programme of an event, by day if it lasts several days; sessions without a start come last, under a heading of their own</f:comment>
<f:if condition="{event.programme}">
    <section class="Event__schedule" id="schedule">
        <base:heading content="{f:translate(domain: 'tw_events.messages', key: 'event.heading.schedule')}">
            <f:if condition="{event.isMultiDay}">
                <f:then>
                    <f:groupedFor each="{event.programme}" as="sessions" groupBy="day" groupKey="day">
                        <f:variable name="first" value="{sessions -> f:first()}" />
                        <f:variable name="title"><f:if condition="{day}"><f:then>{first.startDate -> f:format.date(format: 'l, F j')}</f:then><f:else><f:translate domain="tw_events.messages" key="event.schedule.unscheduled" /></f:else></f:if></f:variable>
                        <section class="Schedule__day" id="schedule-{f:if(condition: day, then: day, else: 'unscheduled')}">
                            <base:heading content="{title}">
                                <f:render section="Sessions" arguments="{sessions: sessions}" />
                            </base:heading>
                        </section>
                    </f:groupedFor>
                </f:then>
                <f:else>
                    <f:variable name="first" value="{event.programme -> f:first()}" />
                    <div class="Schedule__day" id="schedule-{f:if(condition: first.day, then: first.day, else: 'unscheduled')}">
                        <f:render section="Sessions" arguments="{sessions: event.programme}" />
                    </div>
                </f:else>
            </f:if>
        </base:heading>
    </section>
</f:if>

<f:section name="Sessions">
    <ol class="Schedule">
        <f:for each="{sessions}" as="session">
            <li class="Schedule__item Schedule__item--{session.type}" id="{session.slug}"><twc:event.session.item session="{session}" /></li>
        </f:for>
    </ol>
</f:section>
