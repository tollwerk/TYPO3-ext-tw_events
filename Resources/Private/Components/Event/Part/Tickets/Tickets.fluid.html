<f:argument name="event" type="Tollwerk\TwEvents\Domain\Model\Event" description="Event" />
<f:comment>Tickets of an event, as long as it is not over: the ticket information once there is an address of the tickets, the link to register once an editor releases it and until the event starts, unless it is cancelled or postponed</f:comment>
<f:if condition="{event.ticketUrl} && !{event.isPast} && !{event.isCancelled}">
    <section class="Event__tickets" id="tickets">
        <base:heading content="{f:translate(domain: 'tw_events.messages', key: 'event.heading.tickets')}">
            <f:if condition="{event.ticketDescription}">
                <div class="Event__ticket-description"><f:format.html>{event.ticketDescription}</f:format.html></div>
            </f:if>
            <f:if condition="{event.isRegistrationOpen}">
                <p><a class="Event__ticket-link" href="{event.ticketUrl}"><f:translate domain="tw_events.messages" key="event.tickets.link" /></a></p>
            </f:if>
        </base:heading>
    </section>
</f:if>
